<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Controle de Acesso</title>
  <link rel="stylesheet" href="/style.css" />

  <style>
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label{
    top:6px; transform:none; font-size:12px; color: var(--accent);
    background: color-mix(in srgb, var(--bg2) 70%, transparent);
    border-radius: 6px;
  }

  
  .field .icon{
    position:absolute; right:12px; top:50%; transform: translateY(-50%);
    width:20px; height:20px; opacity:.8;
    display:grid; place-items:center; cursor: default;
  }

  
  .toggle-senha{
    position:absolute; right:10px; top:50%; transform: translateY(-50%);
    border:0; background:transparent; color:#cbd5e1; cursor:pointer; padding:6px; border-radius:8px;
  }
  .toggle-senha:hover{ color:var(--accent); background: rgba(129,161,193,.08); }

  
  .actions{ margin-top:6px; display:grid; gap:10px; }
  button[type="submit"]{
    width:100%;
    padding: 14px 18px;
    border:0; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: var(--text); font-weight:700; font-size:16px; letter-spacing:.2px;
    cursor:pointer; transition: transform .08s ease, box-shadow .2s ease, filter .2s ease;
    box-shadow: 0 10px 28px rgba(94,129,172,.30);
  }
  button[type="submit"]:hover{ filter: brightness(1.05); box-shadow:0 14px 40px rgba(129,161,193,.32); }
  button[type="submit"]:active{ transform: translateY(1px); }

  
  .extras{ display:flex; justify-content:space-between; align-items:center; font-size:14px; margin-top: 4px; }
  .link{ color: var(--primary-2); text-decoration:none; }
  .link:hover{ text-decoration:underline; }

  
  #mensagem{ min-height: 20px; margin-top:8px; font-size:14px; color:#ff7a7a; }

  
  :focus-visible{ outline: 3px solid rgba(129,161,193,.5); outline-offset: 2px; }

  
  @media (max-width: 420px){
    .login-card{ padding: 20px; }
    .brand h1{ font-size:22px; }
  }
  </style>
</head>

<body>
  <div class="login-container">
    <h1>Login</h1>

    <form id="login-form" autocomplete="on">
      
      <input
        type="text"
        id="identificador"
        placeholder="Usuário ou e-mail"
        autocomplete="username"
        required
      />
      <input
        type="password"
        id="senha"
        placeholder="Senha"
        autocomplete="current-password"
        required
      />
      <button id="btnEntrar" type="submit">Entrar</button>
    </form>

    <p id="mensagem" style="color:red;"></p>
    <p style="color:#cbd5e1;line-height:1.6">Modo de apresentação local • senha dos usuários de demonstração: 123456</p>
  </div>

  
  <script src="/config.js"></script>
  
  <script src="/login.js"></script>
</body>
</html>
